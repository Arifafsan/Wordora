name: Build Wordora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Assets
        run: bun run build

      - name: Ensure Android Native Project and Resources
        run: |
          if [ ! -d "android" ]; then
            echo "Native Android directory not found. Initializing via Capacitor..."
            bunx cap add android
          else
            if [ ! -f "./android/gradlew" ] || [ ! -f "./android/gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "Gradle wrapper missing in ./android. Restoring wrapper from Capacitor template..."
              tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradlew gradlew.bat gradle/ build.gradle settings.gradle variables.gradle gradle.properties
            fi
            if [ ! -f "./android/app/src/main/res/values/styles.xml" ]; then
              echo "Restoring missing Android resources from Capacitor template..."
              tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android app/src/main/res
            fi
          fi

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./android/gradlew

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -x "./android/gradlew" ]; then
            echo "Error: ./android/gradlew does not exist or is not executable."
            exit 1
          fi
          echo "Gradle wrapper verified and ready: ./android/gradlew"

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --info || {
            echo "::error::Gradle build failed. Dumping build failure details..."
            find app/build/reports app/build/intermediates -name "*.txt" -o -name "*.log" -exec head -n 100 {} + 2>/dev/null || true
            exit 1
          }

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wordora-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
